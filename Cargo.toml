[package]
name = "egui_ltreeview"
version = "0.10.0"
edition = "2021"
authors = ["Leonard Schüngel <schuengel.leonard@gmail.com>"]
license = "MIT"
description = "A tree view widget for egui"
repository = "https://github.com/LennysLounge/egui_ltreeview"
categories = ["gui"]
keywords = ["egui", "gui", "widget", "tree"]
include = ["src/**/*.rs", "Cargo.toml", "LICENSE", "src/doc/doc.md"]

[package.metadata.docs.rs]
features = ["doc"]

[dependencies]
egui = { version = "0.37", default-features = false }
serde = { version = "1", features = ["derive"], optional = true }
make_table_of_contents = { path = "make_table_of_contents", version = "0.1", optional = true }

[dev-dependencies]
eframe = "0.37"
egui_extras = { version = "0.37", features = ["all_loaders"] }
uuid = { version = "1", features = ["v4"] }

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
uuid = { version = "1", features = ["v4", "js"] }
log = "0.4"
wasm-bindgen-futures = "0.4"
web-sys = "0.3"

[features]
default = []
persistence = ["dep:serde", "egui/persistence", "uuid/serde", "eframe/persistence"]
doc = ["dep:make_table_of_contents"]

[[example]]
name = "persistence_without_tree"


[[example]]
name = "persistence_with_tree"
required-features = ["persistence"]
